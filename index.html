<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>happi happi 19/11</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Lora:ital,wght@0,400;1,400&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
  /* ===== MÀU SẮC: đổi tại đây nếu muốn ===== */
  :root{
    --bg:#ead9b5;          /* nền bàn kraft */
    --env:#cfae7f;         /* màu phong thư */
    --env-dark:#bb9867;    /* mặt trong / nếp gấp */
    --paper:#fdfaf2;       /* giấy thư */
    --ink:#2e2723;         /* chữ đen mun mềm */
    --ink-soft:#7a6a5c;
    --rule:#d8cdb4;        /* kẻ ngang trên giấy */
    --seal:#8c2f2b;        /* sáp đỏ */
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 35%, #f6ead0, var(--bg) 75%);
    color:var(--ink);font-family:'Lora',Georgia,serif;overflow:hidden;
  }

  /* ================= PHONG THƯ ================= */
  .stage{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    transition:opacity 1s ease, transform 1.2s ease;
  }
  .stage.done{opacity:0;transform:translateY(60px) scale(.9);pointer-events:none}
  .hint{font-style:italic;color:var(--ink-soft);font-size:.95rem;transition:opacity .5s}
  .stage.opened .hint{opacity:0}

  .envelope{
    font-size:min(20px,4vw); /* 1em = 1/22 chiều rộng phong thư, dùng để canh tem */
    position:relative;width:min(440px,88vw);aspect-ratio:7/5;cursor:pointer;
    perspective:1200px;filter:drop-shadow(0 22px 22px rgba(60,40,20,.35));
    animation:float 5s ease-in-out infinite;
  }
  .envelope:focus-visible{outline:2px solid var(--ink);outline-offset:8px}
  .envelope.open{animation:none}
  @keyframes float{50%{transform:translateY(-6px)}}

  .env-back{position:absolute;inset:0;background:var(--env-dark);border-radius:4px}

  /* Tờ giấy nằm trong phong thư, trượt ra khi mở */
  .env-paper{
    position:absolute;left:6%;right:6%;top:8%;height:84%;z-index:2;
    background:repeating-linear-gradient(var(--paper) 0 17px, var(--rule) 17px 18px);
    border-radius:3px;transition:transform 1s cubic-bezier(.3,.7,.2,1) .8s;
  }
  .open .env-paper{transform:translateY(-62%)}

  /* Mặt trước (3 mảnh tam giác tạo nếp gấp) */
  .env-front{position:absolute;inset:0;z-index:3;pointer-events:none}
  .env-front i{position:absolute;inset:0;border-radius:4px}
  .f-left{background:linear-gradient(100deg,#c4a174,#d3b183);clip-path:polygon(0 0,52% 52%,0 100%)}
  .f-right{background:linear-gradient(260deg,#c4a174,#d3b183);clip-path:polygon(100% 0,48% 52%,100% 100%)}
  .f-bottom{background:linear-gradient(0deg,#c9a878,var(--env));clip-path:polygon(0 100%,50% 45%,100% 100%)}

  /* Nắp phong thư */
  .flap{
    position:absolute;left:0;right:0;top:0;height:56%;z-index:4;
    background:linear-gradient(180deg,#d9b98c,var(--env));
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;transition:transform .9s ease, z-index 0s .45s;
  }
  .open .flap{transform:rotateX(180deg);z-index:1;background:var(--env-dark)}

  /* Tem thư cổ điển (góc trên bên phải) */
  .stamp{
    position:absolute;top:6%;right:5%;z-index:6;width:3.6em;height:4.4em;padding:.5em;
    background:#f2e6c6;border:.28em dotted var(--env);   /* viền chấm tạo răng cưa tem */
    box-shadow:0 1px 2px rgba(60,35,10,.4);transition:opacity .4s;
  }
  .stamp-in{
    width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;
    border:1px solid rgba(60,90,80,.6);background:linear-gradient(160deg,#9bb3a4,#6f9183);
    color:#2f4a40;font-family:'Playfair Display',serif;font-size:.62em;line-height:1;
  }
  .stamp-in svg{width:1.8em;height:1.8em;fill:#8c2f2b;opacity:.85}
  .open .stamp{opacity:0}

  /* Con dấu sáp */
  .seal{
    position:absolute;left:50%;top:56%;z-index:5;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;
    display:grid;place-items:center;color:#f3d9d0;font-family:'Playfair Display',serif;font-style:italic;font-size:1.5rem;
    background:radial-gradient(circle at 35% 30%,#b04a43,var(--seal) 55%,#5e1c19);
    box-shadow:0 3px 8px rgba(60,20,15,.5), inset 0 0 0 4px rgba(255,255,255,.08), inset 0 -3px 6px rgba(0,0,0,.25);
    transition:opacity .4s, transform .4s;
  }
  .open .seal{opacity:0;transform:scale(1.4)}

  /* Dòng chữ nhỏ trên phong thư */
  .to{
    position:absolute;left:0;right:0;bottom:7%;z-index:6;text-align:center;
    font-family:'Homemade Apple',cursive;font-size:clamp(.7rem,2.6vw,.9rem);color:#5a4733;transition:opacity .4s;
  }
  .open .to{opacity:0}

  /* ================= BỨC THƯ ================= */
  .overlay{
    position:fixed;inset:0;overflow-y:auto;padding:32px 14px 60px;
    opacity:0;visibility:hidden;transition:opacity 1s ease, visibility 0s 1s;
  }
  .overlay.show{opacity:1;visibility:visible;transition:opacity 1s ease}
  .letter{
    position:relative;max-width:600px;margin:0 auto;border-radius:5px;
    padding:52px 36px 44px 64px;
    /* giấy kẻ ngang + lề đỏ mờ */
    background:
      linear-gradient(90deg,transparent 46px,rgba(176,74,67,.35) 46px 47px,transparent 47px),
      repeating-linear-gradient(var(--paper) 0 31px, var(--rule) 31px 32px);
    background-position:0 20px;
    box-shadow:0 2px 3px rgba(60,40,20,.15),0 24px 50px -14px rgba(60,40,20,.45);
    transform:scale(.8) translateY(40px);transition:transform 1.3s cubic-bezier(.2,.8,.2,1);
  }
  .overlay.show .letter{transform:none}

  h1{font-family:'Playfair Display',serif;font-weight:500;font-style:italic;font-size:clamp(1.5rem,5.5vw,2rem);line-height:32px;margin-bottom:32px}
  #text{font-size:1.02rem;line-height:32px;white-space:pre-wrap;min-height:10em}
  #text.typing::after{content:"";display:inline-block;width:1px;height:1.1em;margin-left:2px;vertical-align:text-bottom;background:var(--ink);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .sign{font-family:'Homemade Apple',cursive;color:var(--ink-soft);text-align:right;margin-top:32px;opacity:0;transition:opacity 1.5s}
  .sign.show{opacity:1}

  /* Polaroid */
  .polaroid{width:min(240px,80%);margin:40px auto 0;background:#fff;padding:12px 12px 14px;border-radius:4px;box-shadow:0 8px 20px -6px rgba(60,40,20,.4);transform:rotate(-2.5deg)}
  .polaroid .photo{aspect-ratio:1/1;overflow:hidden;background:#e8dfca}
  .polaroid img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.25) contrast(.95)}
  .polaroid p{font-family:'Homemade Apple',cursive;font-size:.8rem;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.4}

  /* Nút + thẻ quà */
  .actions{margin-top:40px;text-align:center}
  .hug{
    font-family:'Homemade Apple',cursive;font-size:1rem;color:var(--ink);background:none;cursor:pointer;
    border:0;border-bottom:1px solid var(--ink-soft);padding:6px 4px;transition:color .3s,border-color .3s;
  }
  .hug:hover{color:var(--seal);border-color:var(--seal)}
  .hug:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  .gift{
    max-height:0;overflow:hidden;opacity:0;transition:max-height .9s ease, opacity .9s ease, margin .9s ease;
  }
  .gift.show{max-height:320px;opacity:1;margin-top:28px}
  .voucher{
    margin:0 auto;max-width:330px;padding:20px 22px;text-align:center;background:#fffdf6;
    border:2px dashed var(--ink-soft);border-radius:8px;transform:rotate(1.5deg);
    box-shadow:0 6px 16px -6px rgba(60,40,20,.35);
  }
  .voucher h2{font-family:'Playfair Display',serif;font-weight:500;font-size:1.2rem;line-height:1.4}
  .voucher p{font-size:.88rem;font-style:italic;color:var(--ink-soft);line-height:1.6;margin-top:6px}

  @media (max-width:520px){
    .letter{padding:40px 20px 36px 46px;
      background:
        linear-gradient(90deg,transparent 32px,rgba(176,74,67,.35) 32px 33px,transparent 33px),
        repeating-linear-gradient(var(--paper) 0 31px, var(--rule) 31px 32px);
      background-position:0 20px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>

<!-- ============ MÀN HÌNH 1: PHONG THƯ ============ -->
<div class="stage" id="stage">
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Mở phong thư">
    <div class="env-back"></div>
    <div class="env-paper"></div>
    <div class="env-front"><i class="f-left"></i><i class="f-right"></i><i class="f-bottom"></i></div>
    <div class="flap"></div>

    <!-- 💌 TEM THƯ: có thể đổi chữ "19/11" hoặc thay trái tim bằng ký hiệu khác -->
    <div class="stamp" aria-hidden="true">
      <div class="stamp-in">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9.2C1.2 8.6 3 5 6.4 5c2 0 3.6 1.1 5.6 3.2C14 6.1 15.6 5 17.6 5 21 5 22.8 8.6 21.3 11.8 19 16.4 12 21 12 21z"/></svg>
        <span>19/11</span>
      </div>
    </div>

    <!-- ✏️ Chữ cái trên con dấu sáp (có thể đổi thành ♥ hoặc chữ cái đầu tên anh ấy) -->
    <div class="seal">♥</div>
    <!-- ✏️ Dòng chữ trên phong thư: thay "Minh" bằng tên bạn trai -->
    <div class="to">to tminh</div>
  </div>
  <p class="hint">chạm vào phong thư để mở</p>
</div>

<!-- ============ MÀN HÌNH 2: BỨC THƯ ============ -->
<div class="overlay" id="overlay">
  <article class="letter">
    <!-- ✏️ TIÊU ĐỀ -->
    <h1>happi happi, chúc tminh của nhuyen 19/11 vui vẻ</h1>

    <!-- Lời thư gõ ra ở đây (nội dung nằm trong biến MESSAGE ở phần script) -->
    <p id="text" aria-live="polite"></p>
    <!-- ✏️ CHỮ KÝ -->
    <p class="sign" id="sign">—chloe</p>

    <!-- 📷 POLAROID: thay link ảnh trong src, đổi chú thích ở thẻ <p> -->
    <figure class="polaroid">
      <div class="photo">
        <img src="myimage.jpg" alt="dyeu">
        <!-- Dùng ảnh trong máy: để ảnh cùng thư mục, ghi src="anh-cua-minh.jpg" -->
      </div>
      <p>Ngày 19 tháng 11 năm 2026</p>
    </figure>

    <div class="actions">
      <!-- ✏️ Chữ trên nút -->
      <button class="hug" id="hug">give u a hug</button>
      <div class="gift" id="gift">
        <!-- 🎁 THẺ QUÀ: sửa tiêu đề (h2) và mô tả (p) -->
        <div class="voucher">
          <h2>Voucher: một chiếc ôm thật dài</h2>
          <p>Dùng bất cứ lúc nào cậu mệt. Không giới hạn, không cần hẹn trước.</p>
        </div>
      </div>
    </div>
  </article>
</div>

<script>
/* ✏️ LỜI CHÚC CỦA BẠN: sửa nội dung trong dấu backtick (` `). Xuống dòng bằng phím Enter. */
const MESSAGE = `Erm, trước hết thì chúc mừng 19/11 nhỉ, tớ tính như mọi lần viết thiệp giấy nhưng nghĩ lại thì kiểu này cũng khá hay, ehe.
Thường ngày tâm sự cũng chẳng thiếu thứ gì, nên chắc phần nhiều chỗ này chỉ để chúc mừng hoi, hoặc có dặn dò một chút.
Cậu cũng biết tớ ít thể hiện tình cảm he, không phải vì không có tình cảm, mà có nhưng không phải kiểu hay thể hiện ra ngoài nên có nhiều khi chắc sẽ làm cậu tổn thương thật, mỗi lần như vậy thì phải nói nhé.
Ựa cũng chả nghĩ ra gì nhiều, nếu có gì nuối tiếc thì chắc là mình có ít ảnh chung mí nhau quá, buồn nhiều. Tớ cũng có nhiều chỗ muốn đi, nhiều trò muốn thử, muốn đi studydate/workdate nữa, ăn uống thì khong thích gì mấy nhưng mà đi cùng cậu trải nghiệm thì đồng ý. 
Hi vọng là sắp tới đi chơi được nhiều nì, học hành thuận lợi, thi cử thuận lợi, làm gì cũng thuận lợi.
Hoà thuận nữa, không cãi nhau, không giấu diếm nhau, không im lặng với nhau, có chuyện gì cùng nhau giải quyết.
Luôn mạnh khoẻ, hạnh phúc, may mắn và thành công nhé.
Yêu cậu, 19/11 vui vẻ.`;

const SPEED = 45; // tốc độ gõ (ms/ký tự), số càng lớn càng chậm

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let opened = false;

/* ---------- Gõ chữ ---------- */
function typeMessage(){
  const el = $('text'), sign = $('sign');
  if (reduce){ el.textContent = MESSAGE; sign.classList.add('show'); return; }
  let i = 0; el.classList.add('typing');
  (function step(){
    el.textContent = MESSAGE.slice(0, ++i);
    if (i < MESSAGE.length){
      const ch = MESSAGE[i-1];
      setTimeout(step, SPEED + (/[.,—]/.test(ch) ? 260 : 0) + (ch === '\n' ? 300 : 0));
    } else { el.classList.remove('typing'); sign.classList.add('show'); }
  })();
}

/* ---------- Mở phong thư: nắp mở → giấy trượt ra → thư hiện ---------- */
function openEnvelope(){
  if (opened) return; opened = true;
  $('envelope').classList.add('open');
  $('stage').classList.add('opened');
  const wait = reduce ? 100 : 2200;           // thời gian chờ giấy trượt ra xong
  setTimeout(() => {
    $('stage').classList.add('done');
    $('overlay').classList.add('show');
    document.body.style.overflow = 'auto';
    setTimeout(typeMessage, reduce ? 0 : 900);
  }, wait);
}
const env = $('envelope');
env.addEventListener('click', openEnvelope);
env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openEnvelope(); } });

/* ---------- Nút "Nhận một chiếc ôm" ---------- */
$('hug').addEventListener('click', () => {
  $('gift').classList.add('show');
  setTimeout(() => $('gift').scrollIntoView({behavior:'smooth', block:'center'}), 300);
});
</script>
</body>
</html>
